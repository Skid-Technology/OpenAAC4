### AAC Persistent VL Management File (Generated by AAC 4.3.7)
#
# This file is used by AAC for its autobanning mechanism. AAC doesn't instantly ban players, but instead can be
# configured to do so after a certain number of kicks. This feature has returned to AAC 4 by popular request.
#
# Please only modify this file when the server is OFF, or AAC will reset it when the server shuts down.
#
# /aac banvl <vl> <player> <info...>
#   This command is used to modify the banVL of a player.
#   Each execution of that command is stored in this file with a timestamp
#   After expiration_time, the execution of the command is forgotten.
#
# When a player's banVL reaches threshold, ban_command will be executed for that player.

expiration_time: 7
expiration_time_unit: DAYS # Can be [DAYS, HOURS, MINUTES, SECONDS]

threshold: 5
ban_command: "aac notify Mock Ban issued for {player}. Configure in bans.yml"

# Example player entry
# dacc8030-0ba4-4c62-bf9a-87f1db29ff99:         # Player UUID used by AAC to identify the player (this is my UUID)
#   name: "konsolas"                            # Last seen username. Not used by AAC, provided for your convenience.
#   history:                                    # List of past /aac banvl commands
#     1565626626421:                            # UNIX timestamp (you can use an online tool to convert this)
#       vl: 2                                   # banVL added by the /aac banvl command
#       info: "Move"                            # info string from the /aac banvl command
#     1565626663854:
#       vl: 4
#       info: "Killaura"
#
# After expiration_time, old entries in the "history" list will be deleted.
# Deletion is handled lazily, so don't worry if you see older entries.
#
# When a ban is actually issued, their record here is removed entirely and transferred to plugins/AAC/bans
# This file is updated on /aac reload and also on server shutdown.

players: {}